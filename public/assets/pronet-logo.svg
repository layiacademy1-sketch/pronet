<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <!-- Blue Gradient -->
    <linearGradient id="pronetBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <!-- Green Gradient -->
    <linearGradient id="pronetGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <!-- Sparkle Glow -->
    <linearGradient id="sparkleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Emblem / Icon Group -->
  <g transform="translate(10, 5)" filter="url(#subtleShadow)">
    <!-- Outer Blue Swoosh (Top & Right) -->
    <path d="M 40 8 C 58 8 72 20 74 38 C 75 48 70 56 63 60 C 58 53 62 43 60 36 C 57 26 48 19 38 18 C 30 17 22 21 16 27 C 22 15 30 8 40 8 Z" fill="url(#pronetBlue)" />
    
    <!-- Outer Green Swoosh (Bottom & Left) -->
    <path d="M 40 72 C 22 72 8 60 6 42 C 5 32 10 24 17 20 C 22 27 18 37 20 44 C 23 54 32 61 42 62 C 50 63 58 59 64 53 C 58 65 50 72 40 72 Z" fill="url(#pronetGreen)" />

    <!-- Central Clean Leaf / Droplet Accent -->
    <path d="M 40 24 C 48 28 52 36 50 44 C 47 52 38 56 32 50 C 28 44 32 32 40 24 Z" fill="url(#pronetBlue)" opacity="0.9" />
    <path d="M 40 26 C 45 32 46 40 41 46 C 36 52 28 48 29 41 C 31 34 36 29 40 26 Z" fill="url(#pronetGreen)" opacity="0.85" />

    <!-- Sparkle 1 (Large Top Right) -->
    <path d="M 68 18 Q 68 25 75 25 Q 68 25 68 32 Q 68 25 61 25 Q 68 25 68 18 Z" fill="url(#sparkleGlow)" stroke="#0284c7" stroke-width="0.75" />
    
    <!-- Sparkle 2 (Small Center-Left) -->
    <path d="M 22 18 Q 22 22 26 22 Q 22 22 22 26 Q 22 22 18 22 Q 22 22 22 18 Z" fill="#ffffff" stroke="#22c55e" stroke-width="0.5" />

    <!-- Sparkle 3 (Small Bottom Right) -->
    <path d="M 62 62 Q 62 65 65 65 Q 62 65 62 68 Q 62 65 59 65 Q 62 65 62 62 Z" fill="#ffffff" stroke="#0284c7" stroke-width="0.5" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(100, 15)">
    <!-- PRO (Blue) -->
    <text x="0" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.03em" fill="#0284c7">
      PRO
    </text>
    <!-- NET (Green) -->
    <text x="96" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.03em" fill="#16a34a">
      NET
    </text>
    
    <!-- Tagline: PROPRETÉ - MULTI-SERVICES -->
    <g transform="translate(2, 58)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.22em" fill="#334155">
        PROPRETÉ - MULTI-SERVICES
      </text>
      <!-- Small colored dot -->
      <circle cx="204" cy="-3" r="2.5" fill="#16a34a" />
    </g>
  </g>
</svg>
